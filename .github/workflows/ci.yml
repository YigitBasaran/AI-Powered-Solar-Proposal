# NOTE: this workflow is committed but has never executed — the project has no
# git remote. Its commands are verified locally. Do not read a green badge into
# its presence.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,pdf]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      # Live-marked tests hit real third-party APIs and are excluded from CI.
      - run: python -m pytest -q -m "not live"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
